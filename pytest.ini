[tool:pytest]
minversion = 7.0
addopts = -vv -rA --showlocals --tb=native --strict-markers --strict-config --maxfail=5 --durations=10
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Retry configuration for flaky tests - ENTERPRISE POLICY
# Policy: Tactical retry with mandatory issue tracking
retries = 3
retry_delay = 1
retry_delay_multiplier = 2
max_retry_delay = 10
retry_exceptions =
    AssertionError
    TimeoutError
    ConnectionError
    asyncio.TimeoutError
    concurrent.futures.TimeoutError
    ResourceWarning
    RuntimeWarning

# Flaky test retry policy - requires issue tracking
flaky_retries = 2
flaky_retry_delay = 2
flaky_retry_delay_multiplier = 1.5
flaky_max_retry_delay = 15

markers =
    unit: Unit tests that test individual components in isolation
    integration: Integration tests that test interactions between components
    e2e: End-to-end tests that test the entire system
    slow: Tests that take a long time to run
    ci-sensitive: Tests that are sensitive to CI environment conditions
    performance: Performance and benchmark tests
    security: Security-related tests
    smoke: Quick smoke tests for basic functionality
    flaky: Tests that may fail intermittently (will be retried automatically)
    resource-intensive: Tests that consume significant system resources
    race-condition: Tests that may expose race conditions in async code
    async-debug: Tests that require asyncio debug mode for proper execution
    retry-on-failure: Tests that should be retried on failure (explicit retry marker)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:asyncio
    ignore::RuntimeWarning:asyncio
    ignore::ResourceWarning:asyncio

timeout = 300
timeout_method = thread
