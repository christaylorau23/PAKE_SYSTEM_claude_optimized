[tool:pytest]
# CI-Specific pytest Configuration
# Optimized for GitHub Actions runner constraints
# This configuration simulates CI environment conditions

minversion = 7.0

# CI-optimized test execution options
addopts =
    -vv
    -rA
    --showlocals
    --tb=short
    --strict-markers
    --strict-config
    --maxfail=3
    --durations=5
    --disable-warnings
    --timeout=300
    --timeout-method=thread
    -x
    --tb=line

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Async configuration
asyncio_mode = auto

# CI-specific markers
markers =
    unit: Unit tests that test individual components in isolation
    integration: Integration tests that test interactions between components
    e2e: End-to-end tests that test the entire system
    slow: Tests that take a long time to run (skip in CI)
    ci-sensitive: Tests that are sensitive to CI environment conditions
    performance: Performance and benchmark tests
    security: Security-related tests
    smoke: Quick smoke tests for basic functionality
    flaky: Tests that may fail intermittently
    resource-intensive: Tests that consume significant system resources
    ci-only: Tests that should only run in CI environment
    local-only: Tests that should only run locally

# Warning filters for CI
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:asyncio
    ignore::RuntimeWarning
    ignore::FutureWarning

# Timeout configuration
timeout = 300
timeout_method = thread

# Coverage configuration for CI
# Note: Coverage is handled by pytest-cov plugin
# This is just for reference
# addopts = --cov=src --cov-report=xml --cov-report=html --cov-fail-under=80

# CI-specific environment variables
# These can be set via environment or CI configuration
env =
    CI = true
    GITHUB_ACTIONS = true
    PYTEST_WORKERS = 1
    PYTEST_TIMEOUT = 300
    PYTEST_MAX_FAILURES = 3
