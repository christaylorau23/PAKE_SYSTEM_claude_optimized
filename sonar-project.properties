# SonarQube Configuration for PAKE System
# Advanced SAST configuration for comprehensive security analysis

sonar.projectKey=pake-system
sonar.organization=pake-system-org
sonar.projectName=PAKE System
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=src/
sonar.tests=tests/
sonar.python.version=3.12

# Test coverage configuration
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=tests/results.xml

# Security analysis configuration
sonar.security.hotspots=true
sonar.security.analysis=true
sonar.security.analysis.mode=advanced

# Code quality rules
sonar.python.pylint.reportPath=pylint-report.txt
sonar.python.bandit.reportPath=bandit-report.json

# Exclusions
sonar.exclusions=**/tests/**,**/test_**,**/__pycache__/**,**/venv/**,**/mcp-env/**,**/node_modules/**,**/build/**,**/dist/**

# Test exclusions
sonar.test.exclusions=**/tests/**,**/test_**

# Duplication detection
sonar.cpd.python.minimumtokens=100

# Security hotspot rules
sonar.security.hotspots.rules=python:S2078,python:S2079,python:S2083,python:S2089,python:S2091

# Vulnerability detection
sonar.security.vulnerabilities.rules=python:S2078,python:S2079,python:S2083,python:S2089,python:S2091,python:S5542,python:S5543

# Additional security rules
sonar.python.security.rules=python:S2078,python:S2079,python:S2083,python:S2089,python:S2091,python:S5542,python:S5543,python:S5544,python:S5545

# Quality gate configuration
sonar.qualitygate.wait=true
