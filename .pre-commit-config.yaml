# Pre-commit hooks configuration for PAKE System
# Enterprise-grade quality gates for Python codebase
#
# This configuration implements automated quality checks that run before every commit,
# ensuring syntax errors and linting issues never enter the version control history.
#
# Installation: pre-commit install
# Manual run: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

repos:
  # Python code quality and formatting with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Ruff linter - catches syntax errors, undefined names, and code quality issues
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types: [python]

      # Ruff formatter - ensures consistent code formatting
      - id: ruff-format
        types: [python]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Ensure files end with newline
      - id: end-of-file-fixer
        types: [text]

      # Remove trailing whitespace
      - id: trailing-whitespace
        types: [text]

      # Check for merge conflict markers
      - id: check-merge-conflict
        types: [text]

      # Check for large files
      - id: check-added-large-files
        args: [--maxkb=1000]

      # Check for debug statements
      - id: debug-statements
        types: [python]

      # Check for private keys and secrets
      - id: detect-private-key
        types: [text]

      # Ensure YAML files are valid
      - id: check-yaml
        types: [yaml]

      # Ensure JSON files are valid
      - id: check-json
        types: [json]

      # Check for TODO/FIXME comments
      - id: check-toml
        types: [toml]

# Configuration for specific hooks
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
