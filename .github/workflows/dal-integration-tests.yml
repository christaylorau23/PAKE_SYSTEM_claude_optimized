name: DAL Integration Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/services/database/**'
      - 'tests/integration/test_dal_integration.py'
      - 'tests/test_dal*.py'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/services/database/**'
      - 'tests/integration/test_dal_integration.py'
      - 'tests/test_dal*.py'

jobs:
  dal-integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: pake_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install testcontainers pytest-asyncio pytest-cov

    - name: Set up test environment
      run: |
        export PAKE_ENVIRONMENT=test
        export PAKE_DEBUG=true
        export USE_VAULT=false
        export TEST_DATABASE_URL=postgresql://test_user:test_password@localhost:5432/pake_test
        export TEST_REDIS_URL=redis://localhost:6379/1
        export TEST_SECRET_KEY=test-secret-key-for-testing-only-never-use-in-production

    - name: Run DAL Integration Tests
      run: |
        python scripts/execute_dal_tests.py

    - name: Run Coverage Analysis
      run: |
        pytest tests/integration/test_dal_integration.py \
          --cov=src/services/database \
          --cov-report=xml \
          --cov-report=html \
          --cov-fail-under=90 \
          --asyncio-mode=auto \
          -v

    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: dal-integration
        name: dal-integration-coverage

    - name: Upload Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: dal-test-results
        path: |
          htmlcov/
          coverage.xml
          DAL_INTEGRATION_TEST_REPORT.md

    - name: Comment PR with Test Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          try {
            const reportPath = path.join(process.cwd(), 'DAL_INTEGRATION_TEST_REPORT.md');
            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## DAL Integration Test Results\n\n${report}`
              });
            }
          } catch (error) {
            console.log('Could not post test results comment:', error);
          }

  dal-performance-tests:
    runs-on: ubuntu-latest
    needs: dal-integration-tests
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: pake_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install pytest-benchmark

    - name: Run DAL Performance Tests
      run: |
        pytest tests/integration/test_dal_integration.py \
          --benchmark-only \
          --benchmark-sort=mean \
          --benchmark-save=dal-performance \
          --asyncio-mode=auto \
          -v

    - name: Upload Performance Results
      uses: actions/upload-artifact@v3
      with:
        name: dal-performance-results
        path: .benchmarks/
