name: DAST Security Scan

on:
  push:
    branches: ['main', 'develop']
    paths:
      - 'src/**'
      - 'package.json'
      - 'pyproject.toml'
      - 'requirements.txt'
  pull_request:
    branches: ['main', 'develop']
    paths:
      - 'src/**'
      - 'package.json'
      - 'pyproject.toml'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: ['staging', 'production']
      scan_type:
        description: 'Scan type'
        required: true
        default: 'full'
        type: choice
        options: ['quick', 'full', 'custom']

env:
  ZAP_HOST: localhost
  ZAP_PORT: 8080
  SCAN_TIMEOUT: 3600
  REPORT_FORMATS: json,html

jobs:
  dast-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-dev

      - name: Install Node.js dependencies
        run: |
          npm ci

      - name: Install OWASP ZAP
        run: |
          wget -q https://github.com/zaproxy/zaproxy/releases/download/v2.14.0/ZAP_2.14.0_Linux.tar.gz
          tar -xzf ZAP_2.14.0_Linux.tar.gz
          sudo mv ZAP_2.14.0 /opt/zap
          sudo chmod +x /opt/zap/zap.sh
          echo "/opt/zap" >> $GITHUB_PATH

      - name: Start application services
        run: |
          # Start PostgreSQL
          sudo systemctl start postgresql

          # Start Redis
          sudo systemctl start redis-server

          # Start application
          python scripts/start_services.py --background

          # Wait for application to be ready
          timeout 300 bash -c 'until curl -f http://localhost:3001/health; do sleep 5; done'

      - name: Run DAST scan
        run: |
          python src/services/security/dast_integration.py \
            --target-url http://localhost:3001 \
            --scan-name "ci_scan_${{ github.run_id }}" \
            --environment staging \
            --timeout ${{ env.SCAN_TIMEOUT }} \
            --formats ${{ env.REPORT_FORMATS }}

      - name: Upload DAST reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-reports-${{ github.run_id }}
          path: reports/dast/
          retention-days: 30

      - name: Upload scan logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-logs-${{ github.run_id }}
          path: logs/dast/
          retention-days: 30

  security-gate:
    runs-on: ubuntu-latest
    needs: dast-scan
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download DAST reports
        uses: actions/download-artifact@v4
        with:
          name: dast-reports-${{ github.run_id }}
          path: reports/dast/

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install security analysis tools
        run: |
          pip install safety bandit semgrep

      - name: Run security gate validation
        run: |
          python scripts/security_gate_validation.py \
            --reports-dir reports/dast/ \
            --max-critical 0 \
            --max-high 2 \
            --max-medium 5 \
            --fail-on-threshold

      - name: Generate security summary
        run: |
          python scripts/generate_security_summary.py \
            --reports-dir reports/dast/ \
            --output security-summary.md

      - name: Upload security summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary-${{ github.run_id }}
          path: security-summary.md

  vulnerability-report:
    runs-on: ubuntu-latest
    needs: [dast-scan, security-gate]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download security summary
        uses: actions/download-artifact@v4
        with:
          name: security-summary-${{ github.run_id }}
          path: .

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install notification tools
        run: |
          pip install requests python-slack-sdk

      - name: Send security notifications
        run: |
          python scripts/send_security_notifications.py \
            --summary-file security-summary.md \
            --slack-webhook ${{ secrets.SLACK_WEBHOOK_URL }} \
            --email-recipients ${{ secrets.SECURITY_EMAIL_LIST }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SECURITY_EMAIL_LIST: ${{ secrets.SECURITY_EMAIL_LIST }}

      - name: Create security issue
        if: failure()
        run: |
          python scripts/create_security_issue.py \
            --summary-file security-summary.md \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --repository ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update security dashboard
        run: |
          python scripts/update_security_dashboard.py \
            --summary-file security-summary.md \
            --dashboard-url ${{ secrets.SECURITY_DASHBOARD_URL }}
        env:
          SECURITY_DASHBOARD_URL: ${{ secrets.SECURITY_DASHBOARD_URL }}
