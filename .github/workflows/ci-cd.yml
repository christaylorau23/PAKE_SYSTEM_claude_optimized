name: CI/CD Pipeline

# Fixed: Using valid GitHub Actions events
on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  # Non-sensitive configuration
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22.18.0'
  REGISTRY_URL: 'ghcr.io'
  IMAGE_NAME: 'pake-system'

  # Sensitive secrets (from GitHub repository secrets)
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  REDIS_URL: ${{ secrets.REDIS_URL }}
  API_KEY: ${{ secrets.API_KEY }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

  # API Keys
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # Optional API Keys
  DID_API_KEY: ${{ secrets.DID_API_KEY }}
  HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}

  # Webhook Security
  WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}

  # HashiCorp Vault Configuration
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
  VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}

jobs:
  # Security scanning job (runs first)
  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for security scanning

    - name: Run security scans
      run: |
        echo "Security scans would run here"
        # Note: This was incorrectly trying to use a workflow file as an action

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    needs: security

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: '1.8.3'
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry virtualenv
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-

    - name: Install Python dependencies
      run: |
        poetry install --no-interaction --no-root

    - name: Install Node.js dependencies
      run: |
        npm ci

    - name: Capture environment snapshot
      run: |
        mkdir -p reports logs
        echo "--- Environment Variables ---" > environment.log
        env >> environment.log
        echo "\n--- Python Packages (pip freeze) ---" > requirements.ci.log
        pip freeze >> requirements.ci.log
        echo "\n--- Poetry Dependency Tree ---" > poetry.tree.log
        poetry show --tree >> poetry.tree.log

    - name: Run Python linting
      run: |
        poetry run ruff check src/ security/ tests/
        poetry run black --check src/ security/ tests/
        poetry run mypy src/ security/

    - name: Run TypeScript linting
      run: |
        npm run lint

    - name: Run tests
      run: |
        poetry run pytest tests/ -vv -rA --showlocals --tb=native --cov=src --cov-report=xml --junitxml=reports/junit.xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml

    - name: Upload diagnostic artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-diagnostic-artifacts
        path: |
          reports/
          logs/
          environment.log
          requirements.ci.log
          poetry.tree.log
          coverage.xml

  # Build and test
  build:
    runs-on: ubuntu-latest
    needs: [security, code-quality]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for build process

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: '1.8.3'
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry virtualenv
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-

    - name: Install dependencies
      run: |
        poetry install --no-interaction --no-root
        npm ci

    - name: Capture environment snapshot
      run: |
        mkdir -p reports logs
        echo "--- Environment Variables ---" > environment.log
        env >> environment.log
        echo "\n--- Python Packages (pip freeze) ---" > requirements.ci.log
        pip freeze >> requirements.ci.log
        echo "\n--- Poetry Dependency Tree ---" > poetry.tree.log
        poetry show --tree >> poetry.tree.log

    - name: Build Python package
      run: |
        poetry build

    - name: Build TypeScript
      run: |
        npm run build

    - name: Run integration tests
      run: |
        poetry run pytest tests/integration/ -vv -rA --showlocals --tb=native --junitxml=reports/integration-junit.xml

    - name: Upload integration test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-integration-artifacts
        path: |
          reports/
          logs/
          environment.log
          requirements.ci.log
          poetry.tree.log

    - name: Build Docker image
      run: |
        docker build -t pake-system:latest .

    - name: Test Docker image
      run: |
        docker run --rm pake-system:latest python -c "import src; print('✅ Build successful')"

  # Deploy to staging (only on develop branch)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [security, code-quality, build]
    if: github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for deployment

    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        # Add your staging deployment commands here

  # Deploy to production (only on main branch)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [security, code-quality, build]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for production deployment

    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment..."
        # Add your production deployment commands here
