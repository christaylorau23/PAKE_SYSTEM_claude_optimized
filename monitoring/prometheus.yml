# PAKE System - Unified Quality Dashboard Prometheus Configuration
# This configuration enables Prometheus to scrape metrics from all sources
# specified in the engineering guide for the Unified Quality Dashboard

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # SonarQube Metrics Exporter (Primary Static Analysis Engine)
  - job_name: 'sonarqube'
    static_configs:
      - targets: ['sonarqube-exporter:9300']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    params:
      sonar_url: ['http://sonarqube:9000']
      sonar_token: ['${SONAR_TOKEN}']
      sonar_project_key: ['pake-system']

  # GitHub Actions Metrics (CI/CD Pipeline Performance)
  - job_name: 'github-actions'
    static_configs:
      - targets: ['github-actions-exporter:9100']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Jira Metrics (Engineering Effectiveness)
  - job_name: 'jira'
    static_configs:
      - targets: ['jira-exporter:9200']
    metrics_path: '/metrics'
    scrape_interval: 60s
    scrape_timeout: 15s

  # PAKE System Application Metrics
  - job_name: 'pake-api'
    static_configs:
      - targets: ['pake-api:8080']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # PAKE Bridge Metrics
  - job_name: 'pake-bridge'
    static_configs:
      - targets: ['pake-bridge:3001']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # PostgreSQL Database Metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Redis Cache Metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Vault Security Metrics
  - job_name: 'vault'
    static_configs:
      - targets: ['vault:8200']
    metrics_path: '/v1/sys/metrics'
    scrape_interval: 30s

# Alertmanager Configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
