# PAKE System - SonarQube Integration Workflow
# This workflow integrates SonarQube analysis with GitHub Actions
# for the Unified Quality Dashboard

name: SonarQube Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  SONAR_PROJECT_KEY: pake-system
  SONAR_ORGANIZATION: pake-system-org

jobs:
  sonarqube-analysis:
    runs-on: ubuntu-latest
    name: "SonarQube Analysis"

    steps:
    - name: "🔍 Checkout Code"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for SonarQube to analyze all changes

    - name: "🐍 Set up Python"
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: "📚 Install Poetry"
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: "💾 Cache Dependencies"
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-3.12-${{ hashFiles('**/poetry.lock') }}

    - name: "📦 Install Dependencies"
      run: poetry install --with dev --no-root

    - name: "🧪 Run Tests with Coverage"
      run: |
        poetry run pytest tests/unit/ \
          --cov=src \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --junitxml=test-results.xml

    - name: "🔒 Run Security Scan"
      run: |
        poetry run bandit -r src/ -f json -o bandit-report.json || true
        poetry run safety check --json --output safety-report.json || true

    - name: "📊 SonarQube Analysis"
      uses: sonarqube-quality-gate-action@v1.0.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        scanMetadataReportFile: target/sonar/report-task.txt
        waitForQualityGate: true
        timeout: 300

    - name: "📈 Upload Coverage to SonarQube"
      run: |
        poetry run sonar-scanner \
          -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
          -Dsonar.organization=${{ env.SONAR_ORGANIZATION }} \
          -Dsonar.python.version=3.12 \
          -Dsonar.python.coverage.reportPaths=coverage.xml \
          -Dsonar.python.bandit.reportPaths=bandit-report.json \
          -Dsonar.python.xunit.reportPath=test-results.xml \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.qualitygate.timeout=300

    - name: "📤 Upload Artifacts"
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: sonarqube-reports-${{ github.sha }}
        path: |
          coverage.xml
          bandit-report.json
          safety-report.json
          test-results.xml
        retention-days: 30

    - name: "📊 Quality Gate Status"
      uses: actions/github-script@v6
      if: always()
      with:
        script: |
          const comment = `## 📊 SonarQube Analysis Results

          **Project:** PAKE System
          **Commit:** \`${{ github.sha }}\`
          **Branch:** \`${{ github.head_ref || github.ref_name }}\`
          **Triggered by:** @${{ github.actor }}

          ### Analysis Status:
          - ✅ **Code Analysis:** Completed
          - ✅ **Test Coverage:** Generated
          - ✅ **Security Scan:** Completed
          - ✅ **Quality Gate:** Evaluated

          ### Quality Metrics:
          - 📊 **Code Smells:** Analyzed for new code
          - 🔒 **Security:** Vulnerabilities and hotspots checked
          - 🧪 **Coverage:** Test coverage calculated
          - 📋 **Duplication:** Code duplication detected
          - 🔍 **Complexity:** Cognitive complexity measured

          ### Dashboard Integration:
          - 📈 **Metrics:** Exported to Prometheus
          - 📊 **Dashboard:** Updated in Grafana
          - 🚨 **Alerts:** Configured for threshold violations

          **Analysis Complete!** 🎉 Quality metrics available in the Unified Quality Dashboard.`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
